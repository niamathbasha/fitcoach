<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitCoach</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ff5a36"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FitCoach">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#ff5a36;--ac2:#ffb020;--ok:#16a34a;--br:#e4e7ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--card:#1a1f27;--tx:#f1f3f6;--mut:#98a2b3;--br:#2a313c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1217;--card:#1a1f27;--tx:#f1f3f6;--mut:#98a2b3;--br:#2a313c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:17px;margin:20px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.hero .mut{color:#fff;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1px solid var(--br);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{width:100%;border:0;background:var(--ac);color:#fff;padding:14px;border-radius:14px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--br)}
.btn:disabled{opacity:.45}
.sr{width:100%;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit}
.ex{display:flex;align-items:center;gap:12px;cursor:pointer}
.ex .box{width:28px;height:28px;border-radius:50%;border:2px solid var(--br);flex:none;display:grid;place-items:center;color:#fff}
.ex.done .box{background:var(--ok);border-color:var(--ok)}
.ex.done .nm{text-decoration:line-through;opacity:.6}
.nm{font-weight:600}
.bar{height:10px;background:var(--br);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bars i{display:block;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:4px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{text-align:center;padding:10px 4px;border-radius:14px;border:1px solid var(--br);background:var(--card);font-size:12px}
.badge span{display:block;font-size:28px}.badge.off{opacity:.35;filter:grayscale(1)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--br);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 8px;font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{background:var(--ok);color:#fff;border-radius:14px;padding:12px;margin-bottom:12px}
</style></head>
<body><main id="app"></main><nav id="nav"></nav>
<script>
var KEY='fitcoach_v1';
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return{p:null,cap:1,logs:[]}}
var S=load();
S.w=S.w||[];S.cw=S.cw||[];S.wts=S.wts||{};
var DBR=null,SYNC='local',tmr=null,RT=0;
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(DBR){clearTimeout(tmr);tmr=setTimeout(function(){DBR.set(JSON.parse(JSON.stringify(S))).catch(function(){SYNC='local'})},800)}}
var EXL=[['Push-ups','push',0,3,10],['Dumbbell shoulder press','push',1,3,10],['Bench press','push',2,3,8],
['Superman hold','pull',0,3,12],['Dumbbell rows','pull',1,3,10],['Lat pulldown','pull',2,3,10],
['Bodyweight squats','legs',0,3,15],['Lunges','legs',0,3,10],['Glute bridges','legs',0,3,15],['Goblet squat','legs',1,3,12],['Romanian deadlift','legs',1,3,10],['Leg press','legs',2,3,10],
['Plank','core',0,3,30,'sec'],['Crunches','core',0,3,15],['Dead bug','core',0,3,12],['Mountain climbers','core',0,3,30,'sec'],
['Jumping jacks','cardio',0,3,40,'sec'],['High knees','cardio',0,3,30,'sec'],['Burpees','cardio',0,3,8],['Jump rope','cardio',0,3,45,'sec'],['Bike intervals','cardio',2,3,60,'sec'],
['Diamond push-ups','push',0,3,8],['Pike push-ups','push',0,3,8],['Dumbbell chest press','push',1,3,10],['Dumbbell lateral raise','push',1,3,12],['Overhead triceps extension','push',1,3,12],['Incline bench press','push',2,3,8],['Cable fly','push',2,3,12],
['Reverse snow angels','pull',0,3,12],['Towel rows','pull',0,3,10],['Dumbbell curls','pull',1,3,12],['Rear delt fly','pull',1,3,12],['Seated cable row','pull',2,3,10],['Face pulls','pull',2,3,15],
['Step-ups','legs',0,3,12],['Wall sit','legs',0,3,30,'sec'],['Calf raises','legs',0,3,20],['Bulgarian split squat','legs',1,3,8],['Barbell squat','legs',2,3,8],['Leg curls','legs',2,3,12],
['Bicycle crunches','core',0,3,20],['Leg raises','core',0,3,12],['Side plank','core',0,3,25,'sec'],['Russian twists','core',1,3,20],['Cable crunches','core',2,3,15],
['Skater hops','cardio',0,3,30,'sec'],['Shadow boxing','cardio',0,3,45,'sec'],['Squat jumps','cardio',0,3,12],['Treadmill intervals','cardio',2,3,60,'sec'],['Rowing machine','cardio',2,3,60,'sec']];
var PAT={'Push-ups':['hpush','c'],'Dumbbell shoulder press':['vpush','c'],'Bench press':['hpush','c'],'Diamond push-ups':['pushiso','i'],'Pike push-ups':['vpush','c'],'Dumbbell chest press':['hpush','c'],'Dumbbell lateral raise':['pushiso','i'],'Overhead triceps extension':['pushiso','i'],'Incline bench press':['hpush','c'],'Cable fly':['pushiso','i'],'Superman hold':['pulliso','i'],'Dumbbell rows':['hpull','c'],'Lat pulldown':['vpull','c'],'Reverse snow angels':['pulliso','i'],'Towel rows':['hpull','c'],'Dumbbell curls':['pulliso','i'],'Rear delt fly':['pulliso','i'],'Seated cable row':['hpull','c'],'Face pulls':['pulliso','i'],'Bodyweight squats':['squat','c'],'Lunges':['lunge','c'],'Glute bridges':['hinge','c'],'Goblet squat':['squat','c'],'Romanian deadlift':['hinge','c'],'Leg press':['squat','c'],'Step-ups':['lunge','c'],'Wall sit':['legiso','i'],'Calf raises':['legiso','i'],'Bulgarian split squat':['lunge','c'],'Barbell squat':['squat','c'],'Leg curls':['legiso','i']};
var EX=EXL.map(function(a){var t=PAT[a[0]]||[a[1],'x'];return{n:a[0],g:a[1],q:a[2],s:a[3],r:a[4],u:a[5]||'reps',p:t[0],role:t[1]}});
var SL={fat:['cardio','legs','push','cardio','pull','core','cardio'],muscle:['push','pull','legs','push','pull','core','legs'],endure:['cardio','cardio','legs','cardio','core','push','cardio'],active:['cardio','legs','push','pull','core','cardio','legs']};
var GOALS={fat:'Lose fat',muscle:'Build muscle',endure:'Boost endurance',active:'Stay active'};
var T='today',E='ok',W={date:'',done:{}},OB=null,RATE=false,FLASH='';
function dk(d){var x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function days(){return new Set(S.logs.map(function(l){return l.d}))}
function streak(){var ds=days(),c=0,t=new Date();if(!ds.has(dk(t)))t.setDate(t.getDate()-1);while(ds.has(dk(t))){c++;t.setDate(t.getDate()-1)}return c}
function weekDays(){var t=new Date(),dow=(t.getDay()+6)%7,a=[];for(var i=0;i<7;i++){var d=new Date(t);d.setDate(t.getDate()-dow+i);a.push(dk(d))}return a}
function weekDone(){var ds=days();return weekDays().filter(function(d){return ds.has(d)}).length}
function xp(){return S.logs.reduce(function(a,l){return a+100+10*l.x},0)}
function totMins(){return S.logs.reduce(function(a,l){return a+l.m},0)}
var BD=[['🌱','First workout',function(){return S.logs.length>=1}],['🔥','3-day streak',function(){return streak()>=3}],['⚡','7-day streak',function(){return streak()>=7}],['💪','10 workouts',function(){return S.logs.length>=10}],['⏱️','300 minutes',function(){return totMins()>=300}],['🏆','Level 3',function(){return xp()>=600}]];
function badgeIds(){return BD.map(function(b,i){return b[2]()?i:-1}).filter(function(i){return i>=0})}
var TN={full:'Full body',upper:'Upper body',lower:'Lower body',push:'Push',pull:'Pull',cardio:'Cardio & core'};
var SLT={full:['squat','hpush','hpull','hinge','vpush','core','cardio'],upper:['hpush','hpull','vpush','vpull','pushiso','pulliso','core'],lower:['squat','hinge','lunge','legiso','lunge','core','cardio'],push:['hpush','vpush','hpush','pushiso','pushiso','core','cardio'],pull:['vpull','hpull','hpull','pulliso','pulliso','core','cardio'],cardio:['cardio','core','cardio','core','cardio','core','cardio']};
var FB={vpull:['hpull','pulliso'],hpull:['pulliso'],pulliso:['hpull'],vpush:['hpush','pushiso'],pushiso:['hpush'],hpush:['vpush'],legiso:['lunge','squat'],hinge:['squat','lunge'],lunge:['squat','hinge'],squat:['lunge','hinge']};
var GM={fat:1.1,muscle:.9,endure:1.25,active:1};
var CYC={3:['full','full','full'],4:['upper','lower','upper','lower'],5:['push','pull','lower','upper','lower'],6:['push','pull','lower','push','pull','lower']};
function suggest(){var c=CYC[S.p.days]||CYC[4];return c[S.logs.length%c.length]}
function mk(e){S.wts=S.wts||{};var m=S.cap*({low:.8,ok:1,hi:1.1}[E])*GM[S.p.goal],sets=Math.max(2,e.s+(m>1.3?1:0)-(m<.75?1:0)),amt=e.u==='sec'?Math.max(10,Math.round(e.r*m/5)*5):Math.max(5,Math.round(e.r*m)),wt=S.wts[e.n]||0;
return{n:e.n,g:e.g,u:e.u,p:e.p,role:e.role,sets:sets,amt:amt,wt:wt,b:{amt:amt,wt:wt}}}
function plan(){var p=S.p,eq=+p.eq,type=W.type||suggest();
if(S.uc&&S.cw.length){var od={c:0,i:1,x:2};return EX.filter(function(e){return S.cw.indexOf(e.n)>=0}).sort(function(a,b){return od[a.role]-od[b.role]}).map(mk)}
var n=Math.max(3,Math.min(7,Math.round(p.min/8))),sl=SLT[type].slice(0,n),seed=S.logs.filter(function(l){return l.t===type}).length,used={},out=[];
if(type!=='cardio'&&(p.goal==='fat'||p.goal==='endure')&&n>=5)sl[n-1]='cardio';
sl.forEach(function(slot,i){var tr=[slot].concat(FB[slot]||[]);for(var k=0;k<tr.length;k++){var c=EX.filter(function(e){return e.p===tr[k]&&e.q<=eq&&!used[e.n]});if(c.length&&c[0].role==='c'){var mq=Math.max.apply(0,c.map(function(x){return x.q}));c=c.filter(function(x){return x.q===mq})}if(c.length){var e=c[(seed+i)%c.length];used[e.n]=1;out.push(mk(e));return}}});
return out}
function anyDone(i){var it=W.items[i];for(var s=0;s<it.sets;s++)if(L(i,s).d)return true;return false}
function refresh(){var F={},tot=0;W.items.forEach(function(it,i){for(var s=0;s<it.sets;s++){var l=L(i,s);if(l.d){var f=it.role==='c'?1:.55;if(it.wt>0)f*=1.3;if(it.g==='cardio'||it.g==='custom')f=.5;var r=parseFloat(l.r);if(r>0){if(r<it.amt*.85)f+=.4;else if(r>it.amt*1.15)f-=.5}F[it.g]=(F[it.g]||0)+f;tot+=f}}});
W.items.forEach(function(it,i){if(it.m||anyDone(i))return;var own=F[it.g]||0,x=Math.max(-1,own+.15*(tot-own)),fr=Math.min(1.1,Math.max(.55,1-.07*x)),fw=Math.min(1.1,Math.max(.7,1-.05*x)),ow=it.wt;
it.fr=fr;it.amt=it.u==='sec'?Math.max(10,Math.round(it.b.amt*fr/5)*5):Math.max(3,Math.round(it.b.amt*fr));it.wt=it.b.wt>0?Math.max(5,Math.round(it.b.wt*fw/5)*5):0;
for(var s=0;s<it.sets;s++){var l=L(i,s);if(!l.d&&(l.w===''||String(l.w)===String(ow||'')))l.w=it.wt||''}})}
function swapList(it,i){var eq=+S.p.eq,have={};W.items.forEach(function(x){have[x.n]=1});
var c=EX.filter(function(e){return e.q<=eq&&!have[e.n]&&e.p===it.p});if(!c.length)c=EX.filter(function(e){return e.q<=eq&&!have[e.n]&&e.g===it.g&&e.role===it.role});
return '<div style="margin-top:8px"><div class="mut">Swap for a similar exercise:</div><div class="chips">'+(c.length?c.map(function(e){return '<button class="chip" data-act="swap" data-i="'+i+'" data-v="'+e.n+'">'+e.n+'</button>'}).join(''):'<span class="mut">No similar exercises for your equipment.</span>')+'</div></div>'}
function chips(k,opts,cur){return '<div class="chips">'+opts.map(function(o){return '<button class="chip'+(String(cur)===o[0]?' on':'')+'" data-act="ob" data-k="'+k+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div>'}
function onboard(){var o=OB;return '<h1>Welcome to FitCoach 💪</h1><p class="mut">Tell me about you. I’ll build workouts that fit your goal and adapt to your capacity as you progress.</p>'+
'<h2>Your name</h2><input type="text" id="nm" value="'+esc(o.n).replace(/"/g,'&quot;')+'" placeholder="e.g. Niamath">'+
'<h2>Goal</h2>'+chips('goal',Object.keys(GOALS).map(function(k){return[k,GOALS[k]]}),o.goal)+
'<h2>Experience</h2>'+chips('lv',[['beg','Beginner'],['int','Intermediate'],['adv','Advanced']],o.lv)+
'<h2>Equipment</h2>'+chips('eq',[['0','None'],['1','Dumbbells'],['2','Full gym']],o.eq)+
'<h2>Days per week</h2>'+chips('days',[['3','3'],['4','4'],['5','5'],['6','6']],o.days)+
'<h2>Minutes per workout</h2>'+chips('min',[['20','20'],['30','30'],['45','45'],['60','60']],o.min)+
DISC+'<button class="btn" data-act="start" style="margin-top:8px">Start training</button>'}
function items(){S.wts=S.wts||{};if(!W.items){W.items=plan();W.log=[];W.edit=-1;W.swap=-1;refresh()}return W.items}
function L(i,s){W.log[i]=W.log[i]||[];return W.log[i][s]||(W.log[i][s]={r:'',w:W.items[i].wt||'',d:false})}
function exDone(i){var it=W.items[i];for(var s=0;s<it.sets;s++)if(!L(i,s).d)return false;return true}
function setsDone(){var c=0;W.items.forEach(function(it,i){for(var s=0;s<it.sets;s++)if(L(i,s).d)c++});return c}
function cap(){if(!W.items)return;document.querySelectorAll('.sr').forEach(function(x){var i=+x.dataset.i;if(W.items[i]){L(i,+x.dataset.s)[x.dataset.sf]=x.value}})}
document.addEventListener('change',cap);
function exCard(it,i){var su=it.u==='sec'?' sec':' reps',dn=exDone(i);
var h='<div class="card'+(dn?' done':'')+'"><div class="row"><div><div class="nm">'+esc(it.n)+(dn?' ✓':'')+'</div><div class="mut">'+it.sets+' × '+it.amt+su+' · '+(it.wt?it.wt+' lb':'bodyweight')+'</div>'+(it.fr&&it.fr<.97?'<div style="font-size:12px;color:var(--ac)">↓ Lowered '+Math.round((1-it.fr)*100)+'% after your earlier sets</div>':'')+'</div><div>'+(anyDone(i)?'':'<button class="chip" data-act="sw" data-v="'+i+'">⇄</button> ')+'<button class="chip" data-act="ed" data-v="'+i+'">✏️</button> <button class="chip" data-act="rm" data-v="'+i+'">🗑</button></div></div>';
if(W.edit===i){h+='<div style="margin-top:8px">'+[['sets','Sets',1],['amt',it.u==='sec'?'Seconds':'Reps',it.u==='sec'?5:1],['wt','Weight (lb)',5]].map(function(f){return '<div class="row" style="margin:6px 0"><span>'+f[1]+'</span><span><button class="chip" data-act="adj" data-i="'+i+'" data-f="'+f[0]+'" data-d="'+(-f[2])+'">−</button> <b>'+it[f[0]]+'</b> <button class="chip" data-act="adj" data-i="'+i+'" data-f="'+f[0]+'" data-d="'+f[2]+'">+</button></span></div>'}).join('')+'</div>'}
if(W.swap===i)h+=swapList(it,i);
h+='<div class="mut" style="margin-top:8px;font-size:12px">Enter what you actually did for each set (reps · lb), then tap Done.</div>';
for(var s=0;s<it.sets;s++){var l=L(i,s);h+='<div class="row" style="margin-top:6px;gap:6px"><span class="mut" style="width:46px;flex:none">Set '+(s+1)+'</span><input type="number" inputmode="decimal" class="sr" data-sf="r" data-i="'+i+'" data-s="'+s+'" value="'+l.r+'" placeholder="'+it.amt+(it.u==='sec'?' sec':' reps')+'"><input type="number" inputmode="decimal" class="sr" data-sf="w" data-i="'+i+'" data-s="'+s+'" value="'+l.w+'" placeholder="lb"><button class="chip'+(l.d?' on':'')+'" style="flex:none" data-act="st" data-i="'+i+'" data-s="'+s+'">'+(l.d?'✓':'Done')+'</button></div>'}
return h+'</div>'}
function picker(){var have={};W.items.forEach(function(x){have[x.n]=1});var gs={push:'Push',pull:'Pull',legs:'Legs',core:'Core',cardio:'Cardio'};
return '<div class="card"><b>Add an exercise</b>'+Object.keys(gs).map(function(g){return '<div class="mut" style="margin-top:8px">'+gs[g]+'</div><div class="chips">'+EX.filter(function(e){return e.g===g&&!have[e.n]}).map(function(e){return '<button class="chip" data-act="add" data-v="'+e.n+'">'+e.n+'</button>'}).join('')+'</div>'}).join('')+'<div class="mut">Or your own:</div><div class="row" style="gap:8px;margin-top:6px"><input type="text" id="cn" placeholder="Exercise name" style="flex:1"><button class="chip on" data-act="addc">Add</button></div></div>'}
function today(){var p=S.p,t=dk(Date.now());if(W.date!==t)W={date:t};
var its=items(),tot=0;its.forEach(function(it){tot+=it.sets});var nd=setsDone(),did=days().has(t);
if(RATE){return '<h1>How did that feel?</h1><p class="mut">Your answer tunes tomorrow’s intensity to your real capacity.</p>'+
['easy|😎 Too easy – push me','ok|👌 Just right','hard|🥵 Too hard – ease off'].map(function(s){var a=s.split('|');return '<button class="btn sec" style="margin-bottom:10px" data-act="rate" data-v="'+a[0]+'">'+a[1]+'</button>'}).join('')}
return (FLASH?'<div class="toast">'+FLASH+'</div>':'')+'<h1>Hi '+esc(p.n||'champ')+' 👋</h1><div class="mut">'+(S.uc&&S.cw.length?'My custom plan':TN[W.type||suggest()]+' · '+GOALS[p.goal])+' · ~'+p.min+' min · intensity '+Math.round(S.cap*100)+'%</div>'+
(did?'<div class="card" style="margin-top:12px">✅ You already trained today. Great work! Here’s another session if you want more.</div>':'')+
(S.uc&&S.cw.length?'':'<h2>Today’s session</h2><div class="chips">'+Object.keys(TN).map(function(k){return '<button class="chip'+((W.type||suggest())===k?' on':'')+'" data-act="sess" data-v="'+k+'">'+TN[k]+(k===suggest()?' ★':'')+'</button>'}).join('')+'</div><div class="mut" style="margin-bottom:6px">★ suggested next in your '+S.p.days+'-day split</div>')+'<h2>How’s your energy today?</h2>'+chips('en',[['low','😴 Low'],['ok','🙂 Okay'],['hi','⚡ High']],E)+
'<div class="card"><div class="row"><b>Today’s workout</b><span class="mut">'+nd+'/'+tot+' sets done</span></div><div class="bar" style="margin-top:8px"><i style="width:'+(tot?Math.round(nd/tot*100):0)+'%"></i></div></div>'+
(RT>0?'<div class="card row"><b>⏱️ Rest <span id="rt">'+RT+'s</span></b><span><button class="chip" data-act="rt" data-v="add">+15s</button> <button class="chip" data-act="rt" data-v="skip">Skip</button></span></div>':'')+
its.map(exCard).join('')+
